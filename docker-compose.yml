services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: offlinesync
      POSTGRES_PASSWORD: offlinesync
      POSTGRES_DB: offlinesync
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U offlinesync -d offlinesync"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=offlinesync;Username=offlinesync;Password=offlinesync
    depends_on:
      postgres:
        condition: service_healthy

  branch:
    build:
      context: .
      dockerfile: Dockerfile.branch
    environment:
      Sync__BaseUrl: http://api:8080
      Branch__Id: pocitos
      Outbox__Path: /tmp/branch-outbox.db
    depends_on:
      - api
